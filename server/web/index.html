<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConvoyPace - Live ETS2 Leaderboard</title>
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.85);
            --border: #30363d;
            --accent: #58a6ff;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --gold: #f1e05a;
            --green: #3fb950;
            --purple: #bc8cff;
            --orange: #ffa657;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .header-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
        }

        .room-badge {
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent);
            border: 1px solid rgba(88, 166, 255, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .route-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.15rem;
            color: var(--gold);
            font-weight: 600;
            padding: 8px 12px;
            background: rgba(241, 224, 90, 0.08);
            border-radius: 8px;
            border: 1px solid rgba(241, 224, 90, 0.2);
        }

        .route-arrow {
            color: var(--text-muted);
        }

        .cargo-tag {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-left: auto;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .connection-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--green);
            box-shadow: 0 0 8px var(--green);
        }

        .dot.connecting {
            background-color: var(--orange);
            box-shadow: 0 0 8px var(--orange);
        }

        .dot.disconnected {
            background-color: #f85149;
            box-shadow: 0 0 8px #f85149;
        }

        /* Leaderboard Table */
        .leaderboard-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(33, 38, 45, 0.9);
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid rgba(48, 54, 61, 0.5);
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr.rank-1 {
            background: rgba(241, 224, 90, 0.05);
        }

        .rank-badge {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--text-muted);
            width: 40px;
            display: inline-block;
        }

        .rank-1 .rank-badge {
            color: var(--gold);
        }

        .rank-2 .rank-badge {
            color: #c0c0c0;
        }

        .rank-3 .rank-badge {
            color: #cd7f32;
        }

        .driver-cell {
            font-weight: 600;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-pill {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-pill.finished {
            background: rgba(63, 185, 80, 0.2);
            color: var(--green);
            border: 1px solid rgba(63, 185, 80, 0.4);
        }

        .status-pill.paused {
            background: rgba(255, 166, 87, 0.2);
            color: var(--orange);
        }

        .status-pill.driving {
            background: rgba(88, 166, 255, 0.2);
            color: var(--accent);
        }

        .distance-cell {
            font-size: 1.1rem;
            font-weight: 700;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        .delta-tag {
            font-size: 0.8rem;
            color: var(--orange);
            font-weight: 600;
            margin-left: 6px;
        }

        .speed-cell {
            color: var(--text-muted);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state h3 {
            margin-bottom: 8px;
            color: var(--text-main);
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header-card">
            <div class="top-row">
                <div class="brand-title">
                    <span>🚚 ConvoyPace</span>
                </div>
                <div class="room-badge" id="roomCodeDisplay">ROOM: --</div>
            </div>

            <div class="route-info" id="routeBanner">
                <span id="routeSource">Connecting...</span>
                <span class="route-arrow">➔</span>
                <span id="routeDest">Destination</span>
                <span class="cargo-tag" id="cargoDisplay"></span>
            </div>

            <div class="status-bar">
                <div class="connection-indicator">
                    <span class="dot" id="connDot"></span>
                    <span id="connStatus">Connecting to convoy...</span>
                </div>
                <div id="driverCount">0 Drivers Active</div>
            </div>
        </header>

        <main class="leaderboard-card">
            <table id="leaderboardTable">
                <thead>
                    <tr>
                        <th style="width: 60px;">Pos</th>
                        <th>Driver</th>
                        <th>Remaining</th>
                        <th>ETA</th>
                        <th>Speed</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <tr>
                        <td colspan="5" class="empty-state">
                            <h3>Waiting for drivers to connect...</h3>
                            <p>Share this Room Code with friends in your ETS2 convoy.</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>

        <footer>
            ConvoyPace &bull; Ultra-lightweight ETS2 Convoy Tracker & Overlay
        </footer>
    </div>

    <script>
        const pathSegments = window.location.pathname.split('/');
        const roomCode = pathSegments[pathSegments.length - 1] || 'DEFAULT';
        document.getElementById('roomCodeDisplay').textContent = `ROOM: ${roomCode}`;

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;

        let socket = null;
        const connDot = document.getElementById('connDot');
        const connStatus = document.getElementById('connStatus');
        const leaderboardBody = document.getElementById('leaderboardBody');
        const driverCount = document.getElementById('driverCount');
        const routeSource = document.getElementById('routeSource');
        const routeDest = document.getElementById('routeDest');
        const cargoDisplay = document.getElementById('cargoDisplay');

        function connect() {
            connDot.className = 'dot connecting';
            connStatus.textContent = 'Connecting to relay server...';

            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                connDot.className = 'dot';
                connStatus.textContent = 'Connected (Live Sync)';
                socket.send(JSON.stringify({
                    type: 'join',
                    room_code: roomCode,
                    driver_name: 'Spectator',
                    is_viewer: true
                }));
            };

            socket.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'leaderboard_update') {
                        renderLeaderboard(msg);
                    }
                } catch (e) {
                    console.error('Error parsing update:', e);
                }
            };

            socket.onclose = () => {
                connDot.className = 'dot disconnected';
                connStatus.textContent = 'Disconnected. Reconnecting in 3s...';
                setTimeout(connect, 3000);
            };

            socket.onerror = () => {
                socket.close();
            };
        }

        function renderLeaderboard(data) {
            // Update route
            if (data.route && data.route.destination) {
                routeSource.textContent = data.route.source || 'En Route';
                routeDest.textContent = data.route.destination;
                cargoDisplay.textContent = data.route.cargo ? `📦 ${data.route.cargo}` : '';
            } else {
                routeSource.textContent = 'Free Roam';
                routeDest.textContent = 'No Shared Destination';
                cargoDisplay.textContent = '';
            }

            const drivers = data.drivers || [];
            driverCount.textContent = `${drivers.length} Driver${drivers.length === 1 ? '' : 's'} Active`;

            if (drivers.length === 0) {
                leaderboardBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            <h3>No active drivers in this room yet</h3>
                            <p>Open ConvoyPace client on your PC and join <strong>${roomCode}</strong>.</p>
                        </td>
                    </tr>`;
                return;
            }

            let html = '';
            drivers.forEach((d, idx) => {
                const rankClass = d.rank <= 3 ? `rank-${d.rank}` : '';
                let statusBadge = '';
                if (d.status === 'FINISHED') {
                    statusBadge = `<span class="status-pill finished">🏁 Finished (${d.finished_rank ? '#' + d.finished_rank : ''})</span>`;
                } else if (d.status === 'PAUSED') {
                    statusBadge = `<span class="status-pill paused">Paused</span>`;
                }

                let deltaStr = '';
                if (d.delta_km > 0 && d.status !== 'FINISHED') {
                    deltaStr = `<span class="delta-tag">+${Math.round(d.delta_km)} km</span>`;
                }

                let distDisplay = '0 km';
                if (d.status === 'FINISHED') {
                    distDisplay = '🏁 FINISHED';
                } else if (d.status === 'JOINED' && (!d.distance_km || d.distance_km <= 0)) {
                    distDisplay = '<span style="color:var(--text-muted);font-size:0.85rem;">Ready / Syncing...</span>';
                } else {
                    distDisplay = `${Math.round(d.distance_km)} km ${deltaStr}`;
                }

                const speedDisplay = (d.status === 'FINISHED' || d.status === 'JOINED') ? '0 km/h' : `${Math.round(d.speed_kmh)} km/h`;
                const etaDisplay = d.time_formatted || '--:--';

                html += `
                    <tr class="${rankClass}">
                        <td><span class="rank-badge">#${d.rank}</span></td>
                        <td>
                            <div class="driver-cell">
                                <span>${escapeHtml(d.driver_name)}</span>
                                ${statusBadge}
                            </div>
                        </td>
                        <td class="distance-cell">${distDisplay}</td>
                        <td>${etaDisplay}</td>
                        <td class="speed-cell">${speedDisplay}</td>
                    </tr>
                `;
            });

            leaderboardBody.innerHTML = html;
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, (m) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[m]);
        }

        // Heartbeat ping
        setInterval(() => {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'ping' }));
            }
        }, 15000);

        connect();
    </script>
</body>
</html>
