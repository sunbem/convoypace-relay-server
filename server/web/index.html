<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <title>ConvoyPace — Live ETS2 Leaderboard</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #21262d;
            --accent: #58a6ff;
            --text: #e6edf3;
            --muted: #7d8590;
            --gold: #e3b341;
            --silver: #c9d1d9;
            --bronze: #d29922;
            --green: #3fb950;
            --orange: #f0883e;
            --red: #f85149;
            --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(1100px 600px at 50% -10%, #14213a 0%, transparent 60%);
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(1, 4, 9, 0.55);
        }

        /* ---------- Header ---------- */
        .header {
            padding: 20px 22px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-icon {
            font-size: 1.4rem;
        }

        .room-badge {
            font-family: var(--mono);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent);
            background: rgba(88, 166, 255, 0.12);
            border: 1px solid rgba(88, 166, 255, 0.35);
            padding: 6px 14px;
            border-radius: 999px;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .room-badge:hover {
            background: rgba(88, 166, 255, 0.22);
        }

        .room-badge:active {
            transform: scale(0.96);
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 16px 0;
        }

        .route-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--gold);
        }

        .route-arrow {
            color: var(--muted);
            font-weight: 400;
        }

        .cargo-tag {
            margin-left: auto;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--muted);
            background: rgba(125, 133, 144, 0.12);
            border: 1px solid var(--border);
            padding: 3px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .conn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }

        .dot.connecting {
            background: var(--orange);
            animation: none;
        }

        .dot.disconnected {
            background: var(--red);
            animation: none;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.45);
            }

            70% {
                box-shadow: 0 0 0 7px rgba(63, 185, 80, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(63, 185, 80, 0);
            }
        }

        .driver-count {
            font-weight: 600;
            color: var(--text);
        }

        /* ---------- Leaderboard ---------- */
        .leaderboard {
            padding: 4px 0;
        }

        .driver-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(33, 38, 45, 0.6);
            animation: rowIn 0.25s ease both;
        }

        .driver-row:last-child {
            border-bottom: none;
        }

        .driver-row:hover {
            background: rgba(177, 186, 196, 0.04);
        }

        @keyframes rowIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .rank-badge {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.95rem;
            color: var(--muted);
            background: rgba(125, 133, 144, 0.12);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .rank-badge.r1 {
            color: #0d1117;
            background: var(--gold);
            border-color: var(--gold);
        }

        .rank-badge.r2 {
            color: #0d1117;
            background: var(--silver);
            border-color: var(--silver);
        }

        .rank-badge.r3 {
            color: #0d1117;
            background: var(--bronze);
            border-color: var(--bronze);
        }

        .driver-main {
            flex: 1;
            min-width: 0;
        }

        .name-line {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .driver-name {
            font-weight: 600;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-pill {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 8px;
            border-radius: 999px;
            flex-shrink: 0;
        }

        .status-pill.driving {
            color: var(--accent);
            background: rgba(88, 166, 255, 0.14);
            border: 1px solid rgba(88, 166, 255, 0.3);
        }

        .status-pill.paused {
            color: var(--orange);
            background: rgba(240, 136, 62, 0.14);
            border: 1px solid rgba(240, 136, 62, 0.3);
        }

        .status-pill.finished {
            color: var(--green);
            background: rgba(63, 185, 80, 0.14);
            border: 1px solid rgba(63, 185, 80, 0.3);
        }

        .status-pill.joined {
            color: var(--muted);
            background: rgba(125, 133, 144, 0.12);
            border: 1px solid var(--border);
        }

        .driver-meta {
            margin-top: 3px;
            font-size: 0.8rem;
            color: var(--muted);
        }

        .driver-right {
            text-align: right;
            flex-shrink: 0;
        }

        .distance {
            font-family: var(--mono);
            font-size: 1.05rem;
            font-weight: 700;
        }

        .distance.finished {
            color: var(--green);
            font-size: 0.95rem;
        }

        .distance.syncing {
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .delta {
            margin-top: 2px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--orange);
        }

        /* ---------- Empty state ---------- */
        .empty-state {
            padding: 48px 24px;
            text-align: center;
            color: var(--muted);
        }

        .empty-icon {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .empty-state h3 {
            color: var(--text);
            font-size: 1.05rem;
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 0.85rem;
        }

        footer {
            margin-top: 4px;
            font-size: 0.78rem;
            color: var(--muted);
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 10px;
            }

            .header {
                padding: 16px;
            }

            .driver-row {
                padding: 12px 14px;
                gap: 10px;
            }

            .cargo-tag {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="card header">
            <div class="header-top">
                <div class="brand">
                    <span class="brand-icon">🚚</span>
                    <span>ConvoyPace</span>
                </div>
                <div class="room-badge" id="roomCodeDisplay" title="Click to copy room code">ROOM: --</div>
            </div>

            <div class="divider"></div>

            <div class="route-banner" id="routeBanner">
                <span id="routeSource">Connecting…</span>
                <span class="route-arrow">→</span>
                <span id="routeDest">Destination</span>
                <span class="cargo-tag" id="cargoDisplay"></span>
            </div>

            <div class="status-row">
                <div class="conn">
                    <span class="dot connecting" id="connDot"></span>
                    <span id="connStatus">Connecting to convoy…</span>
                </div>
                <div class="driver-count" id="driverCount">0 Drivers</div>
            </div>
        </header>

        <main class="card leaderboard">
            <div id="leaderboardBody">
                <div class="empty-state">
                    <div class="empty-icon">🛣️</div>
                    <h3>Waiting for drivers to connect…</h3>
                    <p>Share this Room Code with friends in your ETS2 convoy.</p>
                </div>
            </div>
        </main>

        <footer>
            ConvoyPace &bull; Lightweight ETS2 Convoy Tracker & Overlay
        </footer>
    </div>

    <script>
        const pathSegments = window.location.pathname.split('/');
        const roomCode = pathSegments[pathSegments.length - 1] || 'DEFAULT';
        const roomBadge = document.getElementById('roomCodeDisplay');
        roomBadge.textContent = `ROOM: ${roomCode}`;

        // Click-to-copy room code
        roomBadge.addEventListener('click', () => {
            const original = roomBadge.textContent;
            const restore = () => { roomBadge.textContent = original; };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(roomCode).then(() => {
                    roomBadge.textContent = 'COPIED!';
                    setTimeout(restore, 1200);
                }).catch(() => { });
            }
        });

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;

        let socket = null;
        const connDot = document.getElementById('connDot');
        const connStatus = document.getElementById('connStatus');
        const leaderboardBody = document.getElementById('leaderboardBody');
        const driverCount = document.getElementById('driverCount');
        const routeSource = document.getElementById('routeSource');
        const routeDest = document.getElementById('routeDest');
        const cargoDisplay = document.getElementById('cargoDisplay');

        function connect() {
            connDot.className = 'dot connecting';
            connStatus.textContent = 'Connecting to relay server…';

            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                connDot.className = 'dot';
                connStatus.textContent = 'Connected (Live Sync)';
                socket.send(JSON.stringify({
                    type: 'join',
                    room_code: roomCode,
                    driver_name: 'Spectator',
                    is_viewer: true
                }));
            };

            socket.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'leaderboard_update') {
                        renderLeaderboard(msg);
                    }
                } catch (e) {
                    console.error('Error parsing update:', e);
                }
            };

            socket.onclose = () => {
                connDot.className = 'dot disconnected';
                connStatus.textContent = 'Disconnected. Reconnecting in 3s…';
                setTimeout(connect, 3000);
            };

            socket.onerror = () => {
                socket.close();
            };
        }

        function renderLeaderboard(data) {
            // Update route banner
            if (data.route && data.route.destination) {
                routeSource.textContent = data.route.source || 'En Route';
                routeDest.textContent = data.route.destination;
                cargoDisplay.textContent = data.route.cargo ? `📦 ${data.route.cargo}` : '';
            } else {
                routeSource.textContent = 'Free Roam';
                routeDest.textContent = 'No Shared Destination';
                cargoDisplay.textContent = '';
            }

            const drivers = data.drivers || [];
            driverCount.textContent = `${drivers.length} Driver${drivers.length === 1 ? '' : 's'}`;

            if (drivers.length === 0) {
                leaderboardBody.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🛣️</div>
                        <h3>No active drivers in this room yet</h3>
                        <p>Open the ConvoyPace client on your PC and join room <strong>${escapeHtml(roomCode)}</strong>.</p>
                    </div>`;
                return;
            }

            let html = '';
            drivers.forEach((d) => {
                const medal = d.rank <= 3 ? ` r${d.rank}` : '';

                let pill = '';
                if (d.status === 'FINISHED') {
                    pill = `<span class="status-pill finished">🏁 Finished${d.finished_rank ? ' #' + d.finished_rank : ''}</span>`;
                } else if (d.status === 'PAUSED') {
                    pill = `<span class="status-pill paused">Paused</span>`;
                } else if (d.status === 'JOINED') {
                    pill = `<span class="status-pill joined">Syncing</span>`;
                } else {
                    pill = `<span class="status-pill driving">Driving</span>`;
                }

                let distanceHtml = '';
                let deltaHtml = '';
                if (d.status === 'FINISHED') {
                    distanceHtml = `<div class="distance finished">🏁 Finished</div>`;
                } else if (d.status === 'JOINED' && (!d.distance_km || d.distance_km <= 0)) {
                    distanceHtml = `<div class="distance syncing">Ready…</div>`;
                } else {
                    distanceHtml = `<div class="distance">${Math.round(d.distance_km)} km</div>`;
                    if (d.delta_km > 0) {
                        deltaHtml = `<div class="delta">+${Math.round(d.delta_km)} km</div>`;
                    }
                }

                const speed = (d.status === 'FINISHED' || d.status === 'JOINED') ? 0 : Math.round(d.speed_kmh);
                const eta = d.time_formatted || '--:--';
                const meta = d.status === 'JOINED'
                    ? 'Waiting for telemetry…'
                    : `${speed} km/h · ETA ${eta}`;

                html += `
                    <div class="driver-row">
                        <div class="rank-badge${medal}">${escapeHtml(String(d.rank))}</div>
                        <div class="driver-main">
                            <div class="name-line">
                                <span class="driver-name">${escapeHtml(d.driver_name)}</span>
                                ${pill}
                            </div>
                            <div class="driver-meta">${meta}</div>
                        </div>
                        <div class="driver-right">
                            ${distanceHtml}
                            ${deltaHtml}
                        </div>
                    </div>`;
            });

            leaderboardBody.innerHTML = html;
        }

        function escapeHtml(str) {
            const entities = { 38: 'amp', 60: 'lt', 62: 'gt', 34: 'quot', 39: '#39' };
            return String(str).replace(/[&<>"']/g, (m) => '&' + entities[m.charCodeAt(0)] + ';');
        }

        // Heartbeat ping
        setInterval(() => {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'ping' }));
            }
        }, 15000);

        connect();
    </script>
</body>

</html>
